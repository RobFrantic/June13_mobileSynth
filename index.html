<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FranticMusic">
<meta name="theme-color" content="#e8c6ae">
<title>FranticMusic</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e8c6ae; --key:#c7ccA0; --key-border:#2a2a2a; --track:#1c1c1c;
    --text:#1c1c1c; --active:#8d945f;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#e8c6ae; --key:#c7ccA0; --key-border:#2a2a2a; --text:#1c1c1c; }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Roboto Slab", Georgia, "Times New Roman", serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100%;
  }
  .wrap{max-width:900px; margin:0 auto; padding:16px 18px 24px;}
  .titlebar{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .fs-btn{font-size:1.2rem; padding:6px 14px; line-height:1;}
  @media (orientation:portrait){
    body.force-landscape{
      position:fixed; top:0; left:0; margin:0;
      width:100vh; height:100vw;
      transform: rotate(90deg) translateY(-100%);
      transform-origin: top left;
      overflow:auto;
    }
  }
  .pill{
    background:var(--key); border:2px solid var(--key-border); border-radius:999px;
    padding:6px 18px; font-weight:700; font-size:1rem; cursor:pointer; user-select:none;
    box-shadow:0 2px 0 rgba(0,0,0,.15);
  }
  .pill:active{transform:translateY(1px); box-shadow:none;}
  .pill.active{background:var(--active);}
  .main-grid{display:flex; flex-wrap:wrap; gap:22px; align-items:flex-start; justify-content:space-between;}
  .sliders{display:flex; gap:22px; flex:1 1 320px;}
  .slider-col{display:flex; flex-direction:column; align-items:center; gap:8px;}
  .vtrack{position:relative; width:14px; height:180px;}
  .vtrack input[type=range]{
    position:absolute; left:50%; top:50%;
    width:180px; height:34px; margin:0; padding:0;
    transform:translate(-50%,-50%) rotate(-90deg);
    -webkit-appearance:none; appearance:none; background:transparent; cursor:pointer;
  }
  .vtrack input[type=range]::-webkit-slider-runnable-track{
    width:180px; height:8px; background:var(--track); border-radius:4px;
  }
  .vtrack input[type=range]::-moz-range-track{
    width:180px; height:8px; background:var(--track); border-radius:4px;
  }
  .vtrack input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:20px; height:46px; margin-top:-19px;
    background:var(--key); border:2px solid var(--key-border); border-radius:10px; cursor:grab;
  }
  .vtrack input[type=range]::-moz-range-thumb{
    width:20px; height:46px; background:var(--key); border:2px solid var(--key-border);
    border-radius:10px; cursor:grab;
  }
  .slider-col label{font-size:1rem; white-space:nowrap;}
  .echo-name{font-size:.65rem; opacity:.75; margin-top:-4px;}
  .svld-wrap{position:relative;}
  .svld-menu{
    position:absolute; top:calc(100% + 6px); right:0; min-width:170px;
    background:var(--key); border:2px solid var(--key-border); border-radius:14px;
    padding:6px; display:none; z-index:20; box-shadow:0 4px 10px rgba(0,0,0,.25);
  }
  .svld-menu.open{display:block;}
  .svld-menu .item{
    padding:7px 10px; border-radius:8px; cursor:pointer; font-size:.82rem; white-space:nowrap;
  }
  .svld-menu .item:hover{background:var(--active);}
  .svld-menu .svld-save{font-weight:700; border-bottom:1px solid var(--key-border); margin-bottom:4px; border-radius:8px 8px 0 0;}
  .svld-menu .empty{padding:6px 10px; font-size:.75rem; opacity:.6;}
  .side{display:flex; flex-direction:column; gap:10px; flex:0 0 auto;}
  .row2{display:flex; gap:10px;}
  .octcol{display:flex; flex-direction:column; align-items:center; gap:8px;}
  .octbtn{width:70px; height:44px; display:flex; align-items:center; justify-content:center; font-size:1.3rem;}
  .destroy{
    width:110px; height:104px; display:flex; align-items:center; justify-content:center;
    text-align:center; line-height:1.15; font-size:1rem; padding:6px;
  }
  .randwrap{display:flex; flex-direction:column; align-items:center; margin-top:2px;}
  .rand{
    width:130px; height:130px; border-radius:50%; background:var(--key);
    border:2px solid var(--key-border); display:flex; flex-direction:column;
    align-items:center; justify-content:center; cursor:pointer; user-select:none;
    box-shadow:0 3px 0 rgba(0,0,0,.15);
  }
  .rand:active{transform:translateY(2px); box-shadow:none;}
  .rand .circ{
    width:60px; height:60px; border-radius:50%; border:4px solid var(--key-border);
    display:flex; align-items:center; justify-content:center; font-size:1.15rem; margin-top:4px;
  }
  .keyboard{position:relative; height:130px; margin-top:26px; display:flex;}
  .wkey{
    flex:1; background:#f4f0ea; border:1px solid #333; border-radius:0 0 6px 6px; position:relative;
    display:flex; align-items:flex-end; justify-content:center; padding-bottom:6px; font-size:.65rem;
    color:#555; cursor:pointer;
  }
  .wkey.on{background:#d8d2c4;}
  .bkey{
    position:absolute; top:0; width:6.4%; height:62%; background:#151515; border-radius:0 0 4px 4px;
    cursor:pointer; z-index:2;
  }
  .bkey.on{background:#444;}
  .oct-display{font-size:.85rem; text-align:center; margin-top:2px;}
  .hint{font-size:.75rem; opacity:.7; margin-top:14px; text-align:center;}
  @media (max-width:640px){
    .main-grid{justify-content:center;}
    .sliders{justify-content:center;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="titlebar">
    <div class="pill fs-btn" id="fsBtn" title="Vollbild + Querformat">⛶</div>
    <div class="pill">FranticMusic</div>
  </div>

  <div class="main-grid">
    <div class="sliders">
      <div class="slider-col"><div class="vtrack"><input id="hp" type="range" min="0" max="100" value="30"></div><label>Hi-Pass</label></div>
      <div class="slider-col"><div class="vtrack"><input id="lp" type="range" min="0" max="100" value="70"></div><label>Lo-Pass</label></div>
      <div class="slider-col"><div class="vtrack"><input id="echo" type="range" min="0" max="3" step="1" value="0"></div><label>Echo</label><span class="echo-name" id="echoName">Off</span></div>
      <div class="slider-col"><div class="vtrack"><input id="cutoff" type="range" min="0" max="100" value="55"></div><label>CutOff</label></div>
      <div class="slider-col"><div class="vtrack"><input id="release" type="range" min="0" max="100" value="35"></div><label>Release</label></div>
    </div>

    <div class="side">
      <div class="row2">
        <div class="pill" id="wobbleBtn">Wobble</div>
        <div class="svld-wrap">
          <div class="pill" id="svldBtn">Sv/Ld</div>
          <div class="svld-menu" id="svldMenu">
            <div class="item svld-save" id="svldSave">+ Save</div>
            <div id="presetList"></div>
          </div>
        </div>
      </div>
      <div class="row2">
        <div class="octcol">
          <div class="pill octbtn" id="octUp">+</div>
          <div class="pill octbtn" id="octDown">-</div>
          <div class="oct-display">Octave <span id="octVal">0</span></div>
        </div>
        <div class="pill destroy" id="destroyBtn">Destroy<br>Boy</div>
      </div>
      <div class="randwrap">
        <div class="rand" id="randBtn">
          <span>Rand</span>
          <div class="circ"><span id="randCount">14</span></div>
        </div>
      </div>
    </div>
  </div>

  <div class="keyboard" id="keyboard"></div>
  <div class="hint">Zum Starten irgendwo tippen/klicken. Tasten halten zum Spielen.</div>
</div>

<script>
let ctx, started=false;
let osc1,osc2,osc3, mix, hpFilter, lpFilter, cutoffFilter, ampEnv;
let shaperNode, dryShaper, panner, tremGain, lfo, lfoPanGain, lfoTremGain;
let delayNode, feedbackGain, wetGain, dryGain, masterGain;
let octaveShift=0, destroyLevel=0, wobbleOn=false;
let activeVoice=false;
const ECHO_STEPS=[
  {name:'Off', time:0.20, fb:0,    wet:0},
  {name:'Zimmerhall', time:0.09, fb:0.22, wet:0.22},
  {name:'Halle', time:0.24, fb:0.42, wet:0.42},
  {name:'Kathedrale', time:0.60, fb:0.6,  wet:0.55}
];

const $ = id => document.getElementById(id);

function initAudio(){
  if(started) return;
  started = true;
  ctx = new (window.AudioContext||window.webkitAudioContext)();

  mix = ctx.createGain(); mix.gain.value = 0.33;
  osc1 = ctx.createOscillator(); osc1.type='sine';
  osc2 = ctx.createOscillator(); osc2.type='sawtooth';
  osc3 = ctx.createOscillator(); osc3.type='triangle';
  [osc1,osc2,osc3].forEach(o=>{o.frequency.value=0; o.connect(mix); o.start();});

  hpFilter = ctx.createBiquadFilter(); hpFilter.type='highpass';
  lpFilter = ctx.createBiquadFilter(); lpFilter.type='lowpass';
  cutoffFilter = ctx.createBiquadFilter(); cutoffFilter.type='lowpass'; cutoffFilter.Q.value=3;

  ampEnv = ctx.createGain(); ampEnv.gain.value=0;

  shaperNode = ctx.createWaveShaper();
  setDestroyCurve(0);

  panner = (ctx.createStereoPanner) ? ctx.createStereoPanner() : ctx.createGain();
  tremGain = ctx.createGain(); tremGain.gain.value=1;

  lfo = ctx.createOscillator(); lfo.type='sine'; lfo.frequency.value=5.2; lfo.start();
  lfoPanGain = ctx.createGain(); lfoPanGain.gain.value=0;
  lfoTremGain = ctx.createGain(); lfoTremGain.gain.value=0;
  lfo.connect(lfoPanGain); lfo.connect(lfoTremGain);
  if(panner.pan) lfoPanGain.connect(panner.pan);
  lfoTremGain.connect(tremGain.gain);

  delayNode = ctx.createDelay(1.0); delayNode.delayTime.value=0.28;
  feedbackGain = ctx.createGain(); feedbackGain.gain.value=0;
  wetGain = ctx.createGain(); wetGain.gain.value=0;
  dryGain = ctx.createGain(); dryGain.gain.value=1;
  masterGain = ctx.createGain(); masterGain.gain.value=0.9;

  mix.connect(hpFilter); hpFilter.connect(lpFilter); lpFilter.connect(cutoffFilter);
  cutoffFilter.connect(ampEnv); ampEnv.connect(shaperNode);
  shaperNode.connect(panner); panner.connect(tremGain);

  tremGain.connect(dryGain); dryGain.connect(masterGain);
  tremGain.connect(delayNode); delayNode.connect(feedbackGain); feedbackGain.connect(delayNode);
  delayNode.connect(wetGain); wetGain.connect(masterGain);

  masterGain.connect(ctx.destination);

  applyAllSliders();
}

function setDestroyCurve(level){
  const n=44100;
  const curve=new Float32Array(n);
  const steps = level===0 ? 0 : [0,10,5,3][level];
  for(let i=0;i<n;i++){
    const x = i*2/n - 1;
    curve[i] = steps ? Math.round(x*steps)/steps : x;
  }
  shaperNode.curve = curve;
}

function mapRange(v,inLo,inHi,outLo,outHi){ return outLo + (v-inLo)*(outHi-outLo)/(inHi-inLo); }

function applyAllSliders(){
  if(!ctx) return;
  const hp = +$('hp').value, lp = +$('lp').value, co = +$('cutoff').value;
  hpFilter.frequency.setTargetAtTime(mapRange(hp,0,100,20,1200),ctx.currentTime,0.02);
  lpFilter.frequency.setTargetAtTime(mapRange(lp,0,100,400,9000),ctx.currentTime,0.02);
  cutoffFilter.frequency.setTargetAtTime(mapRange(co,0,100,150,8000),ctx.currentTime,0.02);
  updateEcho();
}

function updateEcho(){
  const step = ECHO_STEPS[+$('echo').value];
  $('echoName').textContent = step.name;
  if(!ctx) return;
  delayNode.delayTime.setTargetAtTime(step.time,ctx.currentTime,0.02);
  feedbackGain.gain.setTargetAtTime(step.fb,ctx.currentTime,0.02);
  wetGain.gain.setTargetAtTime(step.wet,ctx.currentTime,0.02);
}

function getRelease(){
  const r = +$('release').value;
  return mapRange(r,0,100,0.05,2.2);
}

['hp','lp','cutoff'].forEach(id=>$(id).addEventListener('input', applyAllSliders));
$('echo').addEventListener('input', updateEcho);
updateEcho();

// --- Vollbild + Querformat ---
let fsOn=false;
function setFsUi(on){
  fsOn=on;
  $('fsBtn').classList.toggle('active',on);
  document.body.classList.toggle('force-landscape',on);
}
$('fsBtn').addEventListener('click', ()=>{
  initAudio();
  if(!fsOn){
    const el=document.documentElement;
    const req=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
    if(req) req.call(el).catch(()=>{});
    if(screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{});
    setFsUi(true);
  } else {
    const exit=document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen;
    if(exit) exit.call(document).catch(()=>{});
    if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    setFsUi(false);
  }
});
['fullscreenchange','webkitfullscreenchange'].forEach(evt=>{
  document.addEventListener(evt, ()=>{
    const isFs = document.fullscreenElement||document.webkitFullscreenElement;
    if(!isFs && fsOn){
      if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
      setFsUi(false);
    }
  });
});


$('wobbleBtn').addEventListener('click', ()=>{
  initAudio();
  wobbleOn=!wobbleOn;
  $('wobbleBtn').classList.toggle('active',wobbleOn);
  lfoPanGain.gain.setTargetAtTime(wobbleOn?0.85:0,ctx.currentTime,0.05);
  lfoTremGain.gain.setTargetAtTime(wobbleOn?0.35:0,ctx.currentTime,0.05);
  tremGain.gain.setTargetAtTime(wobbleOn?0.75:1,ctx.currentTime,0.05);
});

// --- Destroy Boy ---
$('destroyBtn').addEventListener('click', ()=>{
  initAudio();
  destroyLevel = (destroyLevel+1)%4;
  setDestroyCurve(destroyLevel);
  $('destroyBtn').classList.toggle('active',destroyLevel>0);
  $('destroyBtn').innerHTML = destroyLevel===0 ? 'Destroy<br>Boy' : 'Destroy<br>Boy '+destroyLevel;
});

// --- Octave ---
function updateOct(){ $('octVal').textContent = (octaveShift>0?'+':'')+octaveShift; }
$('octUp').addEventListener('click', ()=>{ octaveShift=Math.min(2,octaveShift+1); updateOct(); });
$('octDown').addEventListener('click', ()=>{ octaveShift=Math.max(-2,octaveShift-1); updateOct(); });

// --- Save / Load (Dropdown, max 13 Presets) ---
const PRESET_LIMIT=13;
let presets=[];
try{ presets=JSON.parse(localStorage.getItem('franticmusic-presets')||'[]'); }catch(e){ presets=[]; }

$('svldBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  $('svldMenu').classList.toggle('open');
});
document.addEventListener('click', ()=>{ $('svldMenu').classList.remove('open'); });
$('svldMenu').addEventListener('click', (e)=>e.stopPropagation());

$('svldSave').addEventListener('click', ()=>{
  initAudio();
  const p={
    hp:$('hp').value, lp:$('lp').value, echo:$('echo').value, cutoff:$('cutoff').value, release:$('release').value,
    wobbleOn, destroyLevel, waves:[osc1.type,osc2.type,osc3.type]
  };
  presets.push(p);
  if(presets.length>PRESET_LIMIT) presets.shift();
  savePresets();
  renderPresetMenu();
});

function savePresets(){
  try{ localStorage.setItem('franticmusic-presets', JSON.stringify(presets)); }catch(e){}
}

function renderPresetMenu(){
  const list=$('presetList');
  list.innerHTML='';
  if(presets.length===0){
    const e=document.createElement('div'); e.className='empty'; e.textContent='Noch keine Presets';
    list.appendChild(e); return;
  }
  presets.forEach((p,idx)=>{
    const d=document.createElement('div'); d.className='item'; d.textContent='Preset '+(idx+1);
    d.addEventListener('click', ()=>loadPresetAt(idx));
    list.appendChild(d);
  });
}

function loadPresetAt(idx){
  initAudio();
  const p=presets[idx]; if(!p) return;
  $('hp').value=p.hp; $('lp').value=p.lp; $('echo').value=p.echo; $('cutoff').value=p.cutoff; $('release').value=p.release;
  if(p.waves){ osc1.type=p.waves[0]; osc2.type=p.waves[1]; osc3.type=p.waves[2]; }
  if(wobbleOn!==p.wobbleOn) $('wobbleBtn').click();
  const targetDestroy=p.destroyLevel||0;
  while(destroyLevel!==targetDestroy) $('destroyBtn').click();
  applyAllSliders();
  $('svldMenu').classList.remove('open');
}

renderPresetMenu();

// --- Rand-O-13 ---
$('randBtn').addEventListener('click', ()=>{
  initAudio();
  const waves=['sine','sawtooth','square','triangle'];
  osc1.type=waves[Math.floor(Math.random()*4)];
  osc2.type=waves[Math.floor(Math.random()*4)];
  osc3.type=waves[Math.floor(Math.random()*4)];
  ['hp','lp','cutoff','release'].forEach(id=>{ $(id).value=Math.floor(Math.random()*100); });
  $('echo').value=Math.floor(Math.random()*4);
  applyAllSliders();
  let n=+$('randCount').textContent; n = n>=99?1:n+1; $('randCount').textContent=n;
  playNote(220*Math.pow(2,octaveShift));
});

// --- Note engine ---
function noteOn(freq){
  initAudio();
  const t=ctx.currentTime;
  [osc1,osc2,osc3].forEach(o=>o.frequency.setTargetAtTime(freq,t,0.005));
  ampEnv.gain.cancelScheduledValues(t);
  ampEnv.gain.setTargetAtTime(0.28,t,0.01);
}
function noteOff(){
  const t=ctx.currentTime;
  ampEnv.gain.cancelScheduledValues(t);
  ampEnv.gain.setTargetAtTime(0,t,getRelease());
}
function playNote(freq){
  noteOn(freq);
  setTimeout(noteOff, 260);
}

// --- Keyboard build ---
const notes=[
  {n:'C',f:261.63,w:true},{n:'C#',f:277.18,w:false},{n:'D',f:293.66,w:true},{n:'D#',f:311.13,w:false},
  {n:'E',f:329.63,w:true},{n:'F',f:349.23,w:true},{n:'F#',f:369.99,w:false},{n:'G',f:392.00,w:true},
  {n:'G#',f:415.30,w:false},{n:'A',f:440.00,w:true},{n:'A#',f:466.16,w:false},{n:'B',f:493.88,w:true},
  {n:'C',f:523.25,w:true}
];
const kb=$('keyboard');
const whites=notes.filter(n=>n.w);
whites.forEach(n=>{
  const d=document.createElement('div'); d.className='wkey'; d.textContent=n.n; kb.appendChild(d);
  bindKey(d,n);
});
let bi=0;
notes.forEach((n,idx)=>{
  if(n.w) return;
  const whiteIdxBefore = notes.slice(0,idx).filter(x=>x.w).length;
  const d=document.createElement('div'); d.className='bkey';
  d.style.left = (whiteIdxBefore/whites.length*100 - 3.2)+'%';
  kb.appendChild(d);
  bindKey(d,n);
});
function bindKey(el,n){
  const down=(e)=>{ e.preventDefault(); initAudio(); el.classList.add('on'); noteOn(n.f*Math.pow(2,octaveShift)); };
  const up=()=>{ el.classList.remove('on'); noteOff(); };
  el.addEventListener('mousedown',down); el.addEventListener('mouseup',up); el.addEventListener('mouseleave',up);
  el.addEventListener('touchstart',down,{passive:false}); el.addEventListener('touchend',up);
}
</script>
</body>
</html>
