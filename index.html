<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>June-13 Synth</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <header>
    <h1>June-13 Synthesizer</h1>
  </header>

  <main class="content-area">
    <!-- PAGE 1: PLAY (PADS) -->
    <div id="playPage" class="page active">
      <div class="pad-grid">
        <button class="chord-pad" data-notes="130.81,164.81,196.00">C-Dur</button>
        <button class="chord-pad" data-notes="146.83,174.61,220.00">D-Moll</button>
        <button class="chord-pad" data-notes="164.81,196.00,246.94">E-Moll</button>
        <button class="chord-pad" data-notes="174.61,220.00,261.63">F-Dur</button>
        <button class="chord-pad" data-notes="196.00,246.94,293.66">G-Dur</button>
        <button class="chord-pad" data-notes="220.00,261.63,329.63">A-Moll</button>
      </div>
    </div>

    <!-- PAGE 2: SETTINGS (OSZILLATOREN & EFFEKTE) -->
    <div id="settingsPage" class="page">
      <button id="btnTestNote" class="btn-test">🔊 Test-Ton spielen</button>

      <!-- Oszillatoren -->
      <div class="control-group">
        <h3>Oszillator 1</h3>
        <select id="osc1Wave">
          <option value="sawtooth">Sägezahn</option>
          <option value="square">Rechteck</option>
          <option value="sine">Sinus</option>
          <option value="triangle">Dreieck</option>
        </select>
        <label>Lautstärke</label>
        <input type="range" id="osc1Vol" min="0" max="1" step="0.01" value="0.8">
      </div>

      <div class="control-group">
        <h3>Oszillator 2</h3>
        <select id="osc2Wave">
          <option value="square">Rechteck</option>
          <option value="sawtooth">Sägezahn</option>
          <option value="sine">Sinus</option>
          <option value="triangle">Dreieck</option>
        </select>
        <label>Lautstärke</label>
        <input type="range" id="osc2Vol" min="0" max="1" step="0.01" value="0.5">
      </div>

      <div class="control-group">
        <h3>Oszillator 3 (Sub)</h3>
        <select id="osc3Wave">
          <option value="sine">Sinus</option>
          <option value="triangle">Dreieck</option>
          <option value="sawtooth">Sägezahn</option>
        </select>
        <label>Lautstärke</label>
        <input type="range" id="osc3Vol" min="0" max="1" step="0.01" value="0.3">
      </div>

      <!-- Filter & Envelope -->
      <div class="control-group">
        <h3>Filter & Envelope</h3>
        <label>Lowpass Cutoff (Hz)</label>
        <input type="range" id="filter" min="100" max="8000" step="10" value="2500">
        <label>Release (Sekunden)</label>
        <input type="range" id="release" min="0.1" max="4.0" step="0.1" value="1.2">
      </div>

      <!-- Reverb -->
      <div class="control-group">
        <h3>Reverb (Hall)</h3>
        <select id="reverbType">
          <option value="hall" selected>Konzertsaal</option>
          <option value="room">Raum</option>
          <option value="cathedral">Kathedrale</option>
          <option value="none">Aus</option>
        </select>
        <label>Hall Mix</label>
        <input type="range" id="reverbMix" min="0" max="1" step="0.05" value="0.4">
      </div>

      <!-- Delay -->
      <div class="control-group">
        <h3>Delay (Echo)</h3>
        <label>Verzögerung (Sekunden)</label>
        <input type="range" id="delayTime" min="0.05" max="1.0" step="0.05" value="0.3">
        <label>Feedback (Echo-Länge)</label>
        <input type="range" id="delayFeedback" min="0" max="0.85" step="0.05" value="0.4">
        <label>Delay Mix</label>
        <input type="range" id="delayMix" min="0" max="1" step="0.05" value="0.3">
      </div>
    </div>

    <!-- PAGE 3: SEQUENCER (LOOP) -->
    <div id="seqPage" class="page">
      <div class="control-group">
        <label>Tempo (BPM): <span id="bpmValue">120</span></label>
        <input type="range" id="bpmSlider" min="60" max="200" step="1" value="120">
      </div>

      <div class="seq-controls">
        <button id="btnPlaySeq" class="btn-seq">▶ Start Loop</button>
        <button id="btnClearSeq" class="btn-seq">Clear</button>
      </div>

      <div class="seq-grid">
        <div class="step-card"><label>1</label><select class="seq-note"></select></div>
        <div class="step-card"><label>2</label><select class="seq-note"></select></div>
        <div class="step-card"><label>3</label><select class="seq-note"></select></div>
        <div class="step-card"><label>4</label><select class="seq-note"></select></div>
        <div class="step-card"><label>5</label><select class="seq-note"></select></div>
        <div class="step-card"><label>6</label><select class="seq-note"></select></div>
        <div class="step-card"><label>7</label><select class="seq-note"></select></div>
        <div class="step-card"><label>8</label><select class="seq-note"></select></div>
      </div>

      <div class="control-group">
        <h3>Loops speichern & laden</h3>
        <div class="preset-controls">
          <input type="text" id="presetName" placeholder="Name z.B. Melodie 1">
          <button id="btnSavePreset" class="btn-seq">Speichern</button>
        </div>
        <select id="savedPresetsSelect" style="margin-top: 8px;">
          <option value="">-- Laden --</option>
        </select>
      </div>
    </div>
  </main>

  <!-- NAVIGATION BOTTOM BAR -->
  <nav class="tab-bar">
    <button id="btnPlayTab" class="nav-btn active">Play</button>
    <button id="btnSettingsTab" class="nav-btn inactive">Settings</button>
    <button id="btnSeqTab" class="nav-btn inactive">Loop</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
